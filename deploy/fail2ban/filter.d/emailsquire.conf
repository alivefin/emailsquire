# EmailSquire sign-in failures (console and mailbox portal), one line per failed attempt:
#   [2026-10-10 12:00:00] production.WARNING: emailsquire auth failure kind=console user=a@b.c ip=203.0.113.9
# kind is console, mailbox or passkey; lines written before the portal existed have no kind. user is -
# when no address is known (a passwordless passkey sign-in with an unknown credential).
[Definition]
failregex = emailsquire auth failure (?:kind=\S+ )?user=\S+ ip=<HOST>\s*$
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
